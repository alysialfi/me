<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a">Lunash: dashboard &amp; deployment</text>
  <text x="40" y="78" font-size="14" fill="#64748b">How the dashboard talks to services, and how it ships</text>

  <g font-size="14" text-anchor="middle">
    <rect x="40" y="130" width="190" height="84" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="135" y="164" font-weight="700" fill="#0c4a6e">Dashboard</text>
    <text x="135" y="186" fill="#0369a1">React · TypeScript · Tailwind</text>

    <rect x="290" y="130" width="190" height="84" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="385" y="164" font-weight="700" fill="#4c1d95">API layer</text>
    <text x="385" y="186" fill="#6d28d9">Node.js · Express</text>

    <rect x="560" y="106" width="190" height="60" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="655" y="142" font-weight="700" fill="#14532d">In-house APIs</text>
    <rect x="560" y="178" width="190" height="60" rx="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="655" y="214" font-weight="700" fill="#78350f">Third-party APIs</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M230 172H288"/><path d="M480 160L558 138"/><path d="M480 184L558 208"/>
  </g>

  <g><polygon points="0,-5 10,0 0,5" transform="translate(288 172) rotate(0) translate(-10 0)" fill="#475569"/><polygon points="0,-5 10,0 0,5" transform="translate(558 138) rotate(-22) translate(-10 0)" fill="#475569"/><polygon points="0,-5 10,0 0,5" transform="translate(558 208) rotate(22) translate(-10 0)" fill="#475569"/><polygon points="0,-5 10,0 0,5" transform="translate(248 351) rotate(0) translate(-10 0)" fill="#475569"/><polygon points="0,-5 10,0 0,5" transform="translate(478 326) rotate(-26) translate(-10 0)" fill="#475569"/><polygon points="0,-5 10,0 0,5" transform="translate(478 386) rotate(29) translate(-10 0)" fill="#475569"/></g>
  <text x="40" y="296" font-size="16" font-weight="700" fill="#0f172a">Deployment pipeline</text>
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="316" width="150" height="70" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="115" y="346" font-weight="700" fill="#0f172a">GitHub</text><text x="115" y="368" fill="#475569">source</text>
    <rect x="250" y="316" width="170" height="70" rx="12" fill="#f1f5f9" stroke="#64748b"/>
    <text x="335" y="346" font-weight="700" fill="#0f172a">Automated build</text><text x="335" y="368" fill="#475569">Docker · no manual steps</text>
    <rect x="480" y="300" width="190" height="48" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="575" y="330" font-weight="700" fill="#1e3a8a">Google Cloud (start)</text>
    <rect x="480" y="362" width="190" height="48" rx="12" fill="#ffedd5" stroke="#ea580c"/>
    <text x="575" y="392" font-weight="700" fill="#7c2d12">AWS (after ~1 year)</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M190 351H248"/><path d="M420 340L478 326"/><path d="M420 362L478 386"/>
    <path d="M575 348V360" stroke-dasharray="4 3"/>
  </g>
  <g font-size="13" fill="#334155">
    <text x="710" y="324" font-weight="700">Why the move went smoothly</text>
    <text x="710" y="346">GCP patterns carried over to AWS.</text>
    <text x="710" y="378" font-weight="700">What serverless gave</text>
    <text x="710" y="400">Built-in logging, auth and</text>
    <text x="710" y="418">network management.</text>
  </g>
  <text x="40" y="500" font-size="12" fill="#94a3b8">Simplified from the Lunash case study.</text>
</svg>
